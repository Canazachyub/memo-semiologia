<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Métodos · prueba</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top" style="grid-template-columns:1fr auto">
  <div class="brand"><span class="logo">🧩</span><div><h1>Métodos (página de prueba)</h1>
    <p class="sub">Monta js/metodos.js con data/metodos.json, memoria.json y atlas.json</p></div></div>
  <div class="tools"><button id="tema" class="icon-btn" aria-label="Cambiar tema">🌓</button></div>
</header>
<main><section id="v-metodos" class="vista on"><div id="metodos"></div></section></main>
<p id="log" class="pie" aria-live="polite"></p>
<script type="module">
  import { crearMetodos } from './js/metodos.js';
  const j = (u) => fetch(u, { cache: 'no-cache' }).then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
  const [METODOS, MEMO, ATLAS] = await Promise.all(['data/metodos.json', 'data/memoria.json', 'data/atlas.json'].map(j));
  const M = crearMetodos({ METODOS, MEMO, ATLAS, raiz: document.getElementById('metodos') });
  M.pintar();
  window.__M = M;
  window.addEventListener('memo:ir', (e) => { document.getElementById('log').textContent = `memo:ir → ${e.detail.id} (hash ${location.hash})`; });
  try { const t = localStorage.getItem('memo-semio-tema'); if (t) document.documentElement.dataset.theme = t; } catch {}
  document.getElementById('tema').addEventListener('click', () => {
    const r = document.documentElement;
    const oscuro = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = oscuro ? 'light' : 'dark';
  });
</script>
</body>
</html>
